        - generic [ref=f495e474]: You set it
      - generic [ref=f495e475]: Available, Triage, Break — whatever your organisation has set up. Pick one from the status widget.
    - generic [ref=f495e478]:
      - generic [ref=f495e479]:
        - generic [ref=f495e480]: Away from Desk
        - generic [ref=f495e481]: Automatic
      - generic [ref=f495e482]: Applied after 5 minutes without keyboard or mouse. You are still signed in, so colleagues know you are reachable.
    - generic [ref=f495e485]:
      - generic [ref=f495e486]:
        - generic [ref=f495e487]: Logged Out
        - generic [ref=f495e488]: Automatic
      - generic [ref=f495e489]: Applied when you sign out, or when the app has been closed for 15 minutes. Drops off this card an hour later.
    - generic [ref=f495e492]:
      - generic [ref=f495e493]:
        - generic [ref=f495e494]: On Leave
        - generic [ref=f495e495]: You set it
      - generic [ref=f495e496]: Book it in the status widget and colleagues see the date you are back.
    - paragraph [ref=f495e497]: Away from Desk and Logged Out are Blinx statuses — every organisation has them, and they cannot be removed. Everything else is yours to configure.