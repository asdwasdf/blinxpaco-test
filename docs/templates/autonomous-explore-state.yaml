# Autonomous paco-explore checkpoint (owner: paco-explore mode `autonomous`).
# Separate from ticket manifests and paco-discover checkpoints. Redacted only: no PII/auth data.
version: 1
roles:
  "<role>":
    environment: dev
    map_last_built: null          # YYYY-MM-DD
    modules:
      - module: "<Module>"
        tier: 7                     # 1 Patient … 5 Role Groups, 6 other operational, 7 Configuration/admin
        features:
          - feature: "<Feature>"
            entry: "<nav path>"
            route: "<path>"
            workflow_doc: docs/product/workflows/<feature>.md
            status: unmapped        # unmapped | mapped | partial-interactive | deep | blocked
            needs_reverify: false
            last_verified: null
            coverage:               # none | partial | done | n/a (+ note)
              navigation: none
              main_workflow: none
              branches_states: none
              mutation: none
              validation: none
              persistence: none
              relationships: none
              errors_edge: none
            coverage_note: null     # ≤2 short sentences, no timestamps; details in ledger
            blocker: null           # ≤2 short sentences; shared-cause blockers link a decision id
            decision: null          # e.g. DEC-shared-list-save
    decisions:                      # grouped blockers needing tester authorization
      - id: "DEC-<slug>"
        question: "<one consolidated question>"
        scope: whole-list           # owned-row | whole-list | unknown-scope
        open_questions: []          # OQ ids sharing this root cause
        affected: []                # features
        status: pending             # pending | answered
        answer: null                # tester answer + date + ledger ref
    frontier:                       # pending exploration targets
      - target: "<Module/Feature or branch>"
        reason: "<why>"
        provenance: "<run-id/ledger ref/state>"
        priority: 0
    open_questions: []
    leftovers: []                   # { name: QA-test-..., feature, reason }
    active_run:
      run_id: null
      started_at: null
      budget: { max_features: 6, max_minutes: 120, max_meaningful_states: 80 }
      used: { features: 0, minutes: 0, meaningful_states: 0 }   # minutes = active minutes (npm run explore:run)
      locked_role: null             # set by explore:run start; header role khác → role_drift
      last_tick_at: null
      pending_mutation: null        # ledger line đang chạy; xóa khi đã ghi kết quả
      current_target: null
      stage: done                   # running | paused | done
    runs: []                        # one line per run: { run_id, date, stage, progress, outcome_path }
    next_steps: []                  # ≤5 items, ≤1 sentence each
