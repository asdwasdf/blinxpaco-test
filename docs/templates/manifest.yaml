schema_version: 1

ticket:
  key: ""
  folder_name: ""
  source_directory: ""
  primary_source: ticket.md

input_snapshot:
  revision: 1
  generated_at: ""
  files: []

fast_path:
  video_ingest: not_applicable
  graph_lookup: pending
  unresolved_blockers: 0
  automation_decision: null
  mutation_ledger: null
  durable_evidence: []

workflow:
  status: pending
  current_phase: DISCOVER
  last_completed_phase: null
  updated_at: ""
  checkpoints: []

phases:
  DISCOVER: &pending_phase
    status: pending
    outcome: null
    input_revision: 1
    updated_at: ""
    artifacts: []
    warnings: []
    blockers: []
  INGEST: *pending_phase
  ANALYZE: *pending_phase
  LOCATE:
    <<: *pending_phase
    budget:
      views_used: 0
      views_limit: 12
      elapsed_minutes: 0
      minutes_limit: 15
  EXPLORE: *pending_phase
  TEST_DESIGN: *pending_phase
  AUTOMATION_REVIEW: *pending_phase
  AUTOMATE: *pending_phase
  EXECUTE: *pending_phase
  REPORT: *pending_phase
  COMPLETE: *pending_phase

outputs:
  feature-location.md:
    owner: paco-explore
    path: "docs/tickets/<ticket-folder>/feature-location.md"
    state: missing
    input_revision: 1
    sha256: null
