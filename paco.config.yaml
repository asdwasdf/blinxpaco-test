product: Paco
environments:
  default: dev
  dev:
    baseUrl: https://blinx.dev.blinxpaco-np.com
    dashboardPath: /paco/dashboard

paths:
  ticketSource: ticket
  ticketOutput: docs/tickets
  testResults: test-results
  playwrightAuth: playwright/.auth

ticket:
  sourcePattern: "^[A-Z][A-Z0-9]*-[0-9]+-[a-z0-9]+(?:-[a-z0-9]+)*$"
  primarySourceFile: ticket.md

jira:
  origin: https://blinxsolutions.atlassian.net
  browsePath: /browse/

safety:
  mutationEnabledEnvironments: [dev]
  allowedHosts: [blinx.dev.blinxpaco-np.com, pac2-3798.dev.blinxpaco-np.com, pac2-4700-qs-only.dev.blinxpaco-np.com]
  externalDevHosts: [pac2-6763-send-key.dev.blinxpaco-np.com, nhs-comms-hub-dev.blinxhealthcare.com]

defaults:
  readOnly: true
  language: vi
  uiTermsLanguage: en
  browser: chromium
  authStrategy: manual
  locateMaxMinutes: 15
  locateMaxViews: 12
  reusableRouteMaxViews: 3
